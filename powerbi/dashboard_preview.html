<style>
:root{
  --accent:#2a78d6; --accent-ink:#1c5cab;
  --ground:#f2f5f9; --card:#ffffff;
  --text-primary:#10151c; --text-secondary:#4b5566; --text-muted:#8994a6;
  --border:rgba(16,21,28,0.09); --grid:#e7ebf1;
  --good:#0ca30c; --warning:#c98500; --critical:#d03b3b;
  --good-bg:rgba(12,163,12,0.10); --warning-bg:rgba(201,133,0,0.12); --critical-bg:rgba(208,59,59,0.10);
  --shadow:0 1px 2px rgba(16,21,28,0.04), 0 8px 24px -12px rgba(16,21,28,0.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#4a95ef; --accent-ink:#8fc0ff;
    --ground:#0c1015; --card:#141a22;
    --text-primary:#eef1f6; --text-secondary:#b3bcca; --text-muted:#7d8698;
    --border:rgba(255,255,255,0.09); --grid:#232b36;
    --good:#2fbf4f; --warning:#e0a419; --critical:#e2635f;
    --good-bg:rgba(47,191,79,0.12); --warning-bg:rgba(224,164,25,0.12); --critical-bg:rgba(226,99,95,0.12);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --accent:#4a95ef; --accent-ink:#8fc0ff;
  --ground:#0c1015; --card:#141a22;
  --text-primary:#eef1f6; --text-secondary:#b3bcca; --text-muted:#7d8698;
  --border:rgba(255,255,255,0.09); --grid:#232b36;
  --good:#2fbf4f; --warning:#e0a419; --critical:#e2635f;
  --good-bg:rgba(47,191,79,0.12); --warning-bg:rgba(224,164,25,0.12); --critical-bg:rgba(226,99,95,0.12);
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
body{
  background:var(--ground); color:var(--text-primary);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; min-height:100vh;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
h1,h2,h3{text-wrap:balance; margin:0;}

/* ---- shell ---- */
.sidebar{
  width:220px; flex:0 0 220px; padding:24px 16px; border-right:1px solid var(--border);
  display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 10px 20px;}
.brand-mark{
  width:30px; height:30px; border-radius:8px; background:var(--accent);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; flex:0 0 auto;
}
.brand-name{font-weight:600; font-size:15px; letter-spacing:-0.01em;}
.brand-sub{font-size:10.5px; color:var(--text-muted); letter-spacing:0.04em; text-transform:uppercase;}
nav{display:flex; flex-direction:column; gap:2px;}
.nav-btn{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; border:none; background:none;
  color:var(--text-secondary); font:inherit; font-size:13.5px; font-weight:500; text-align:left; cursor:pointer;
  transition:background .12s ease, color .12s ease;
}
.nav-btn:hover{background:var(--border); color:var(--text-primary);}
.nav-btn[aria-current="page"]{background:var(--accent); color:#fff;}
.nav-icon{width:16px; height:16px; flex:0 0 auto; opacity:0.9;}
.sidebar-foot{margin-top:auto; padding:10px; font-size:11px; color:var(--text-muted); line-height:1.5;}

.main{flex:1; min-width:0; padding:28px 36px 64px;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:22px; font-weight:600; letter-spacing:-0.01em;}
.page-head p{margin:4px 0 0; color:var(--text-secondary); font-size:13.5px;}
.asof{font-size:11.5px; color:var(--text-muted);}

/* ---- grid & cards ---- */
.grid{display:grid; gap:16px;}
.kpi-row{grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); margin-bottom:18px;}
.chart-row-2{grid-template-columns:2fr 1fr;}
.chart-row-even{grid-template-columns:1fr 1fr;}
@media (max-width:900px){.chart-row-2, .chart-row-even{grid-template-columns:1fr;}}

.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px;
  box-shadow:var(--shadow);
}
.card h3{font-size:13px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:14px;}
.card .card-note{font-size:11.5px; color:var(--text-muted); margin-top:8px; line-height:1.5;}

.kpi{display:flex; flex-direction:column; gap:6px;}
.kpi-label{font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
.kpi-value{font-size:28px; font-weight:600; letter-spacing:-0.02em; font-family:"IBM Plex Mono",monospace;}
.kpi-delta{font-size:12px; font-weight:500; display:flex; align-items:center; gap:4px;}
.kpi-delta.down{color:var(--critical);} .kpi-delta.up{color:var(--good);} .kpi-delta.flat{color:var(--text-muted);}

.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-size:11.5px; font-weight:600; white-space:nowrap;
}
.badge .dot{width:6px; height:6px; border-radius:50%;}
.badge.good{background:var(--good-bg); color:var(--good);}
.badge.warning{background:var(--warning-bg); color:var(--warning);}
.badge.critical{background:var(--critical-bg); color:var(--critical);}
.badge.neutral{background:var(--border); color:var(--text-secondary);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-muted); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--border);}
td{padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text-secondary);}
td.mono, th.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

svg text{fill:var(--text-secondary); font-family:"IBM Plex Sans",sans-serif;}
.grid-line{stroke:var(--grid); stroke-width:1;}
.axis-label{font-size:10.5px; fill:var(--text-muted);}
.value-label{font-size:11px; font-weight:600; fill:var(--text-primary);}

.tooltip{
  position:fixed; pointer-events:none; background:var(--text-primary); color:var(--card);
  font-size:12px; padding:6px 10px; border-radius:7px; z-index:50; opacity:0; transition:opacity .08s;
  font-family:"IBM Plex Mono",monospace; white-space:nowrap;
}

.word-cloud{display:flex; flex-wrap:wrap; align-items:baseline; gap:9px 14px; padding:6px 2px;}
.word-cloud span{color:var(--accent); font-weight:600; line-height:1;}

.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--text-secondary); margin-top:10px;}
.legend-item{display:flex; align-items:center; gap:6px;}
.legend-swatch{width:9px; height:9px; border-radius:2px;}

[hidden]{display:none !important;}

@media (max-width:760px){
  body{flex-direction:column;}
  .sidebar{position:relative; width:100%; height:auto; flex-direction:row; align-items:center; overflow-x:auto; padding:14px 16px; gap:8px;}
  .brand{padding:0; margin-right:8px;}
  .sidebar-foot{display:none;}
  nav{flex-direction:row;}
  .main{padding:20px 16px 48px;}
}
</style>

const tooltip = document.getElementById("tooltip");
function showTip(evt, text){
  tooltip.textContent = text;
  tooltip.style.left = (evt.clientX + 14) + "px";
  tooltip.style.top = (evt.clientY - 10) + "px";
  tooltip.style.opacity = 1;
}
function hideTip(){ tooltip.style.opacity = 0; }

function svgEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function lineChart(data, xKey, series, opts={}){
  const w = opts.w || 560, h = opts.h || 220, pad = {t:14, r:16, b:26, l:40};
  const svg = svgEl("svg", {viewBox:`0 0 ${w} ${h}`, width:"100%", height:h, style:"overflow:visible"});
  const xs = data.map(d => d[xKey]);
  const allVals = series.flatMap(s => data.map(d => d[s.key]).filter(v => v !== null && v !== undefined));
  let yMin = Math.min(0, ...allVals), yMax = Math.max(...allVals);
  if (opts.zeroLine === false) { yMin = Math.min(...allVals); }
  const pd_ = (yMax - yMin) * 0.12 || 1;
  yMin -= pd_; yMax += pd_;
  const x = i => pad.l + (i/(xs.length-1)) * (w - pad.l - pad.r);
  const y = v => (h - pad.b) - ((v - yMin)/(yMax - yMin)) * (h - pad.t - pad.b);

  for (let i=0;i<4;i++){
    const gy = pad.t + i*(h-pad.t-pad.b)/3;
    svg.appendChild(svgEl("line", {x1:pad.l, x2:w-pad.r, y1:gy, y2:gy, class:"grid-line"}));
  }
  if (yMin < 0 && yMax > 0){
    svg.appendChild(svgEl("line", {x1:pad.l, x2:w-pad.r, y1:y(0), y2:y(0), stroke:"var(--text-muted)", "stroke-width":1, "stroke-dasharray":"3,3"}));
  }

  const tickIdx = [0, Math.floor(xs.length/2), xs.length-1];
  tickIdx.forEach(i => {
    const label = String(xs[i]).slice(0,7);
    const t = svgEl("text", {x:x(i), y:h-6, class:"axis-label", "text-anchor": i===0 ? "start" : (i===xs.length-1 ? "end" : "middle")});
    t.textContent = label;
    svg.appendChild(t);
  });

  series.forEach(s => {
    let pathD = "";
    data.forEach((d,i) => {
      const v = d[s.key];
      if (v === null || v === undefined) return;
      pathD += (pathD ? "L" : "M") + x(i) + " " + y(v) + " ";
    });
    svg.appendChild(svgEl("path", {d:pathD, fill:"none", stroke:s.color, "stroke-width":s.width||2, "stroke-linejoin":"round", "stroke-linecap":"round", opacity:s.opacity||1}));
  });

  const hitW = (w-pad.l-pad.r)/(xs.length-1);
  data.forEach((d,i) => {
    const hit = svgEl("rect", {x:x(i)-hitW/2, y:pad.t, width:hitW, height:h-pad.t-pad.b, fill:"transparent"});
    hit.addEventListener("mousemove", (e) => {
      const parts = series.filter(s=>d[s.key]!=null).map(s => `${s.label}: ${d[s.key]}`);
      showTip(e, `${d[xKey]}  ·  ${parts.join("  ·  ")}`);
    });
    hit.addEventListener("mouseleave", hideTip);
    svg.appendChild(hit);
  });

  return svg;
}

function barChart(data, labelKey, valueKey, opts={}){
  const horizontal = opts.horizontal !== false;
  const w = opts.w || 520;
  const barH = opts.barH || 26, gap = opts.gap || 10;
  const h = data.length * (barH+gap) + gap;
  const pad = {l: opts.padL || 110, r: 46, t:6, b:6};
  const svg = svgEl("svg", {viewBox:`0 0 ${w} ${h}`, width:"100%", height:h});
  const max = opts.max || Math.max(...data.map(d=>d[valueKey])) * 1.08;
  const scale = v => (v/max) * (w - pad.l - pad.r);

  data.forEach((d,i) => {
    const yy = pad.t + i*(barH+gap);
    const label = svgEl("text", {x:pad.l-10, y:yy+barH/2+4, "text-anchor":"end", class:"axis-label", "font-size":12});
    label.textContent = d[labelKey];
    svg.appendChild(label);

    const bw = Math.max(scale(d[valueKey]), 2);
    const rect = svgEl("rect", {x:pad.l, y:yy, width:bw, height:barH, rx:5, fill:d.color || opts.color || "var(--accent)"});
    rect.addEventListener("mousemove", (e)=> showTip(e, `${d[labelKey]}: ${opts.fmt ? opts.fmt(d[valueKey]) : d[valueKey]}`));
    rect.addEventListener("mouseleave", hideTip);
    svg.appendChild(rect);

    const val = svgEl("text", {x:pad.l+bw+8, y:yy+barH/2+4, class:"value-label", "font-size":12});
    val.textContent = opts.fmt ? opts.fmt(d[valueKey]) : d[valueKey];
    svg.appendChild(val);
  });
  return svg;
}

function divergingBar(segments, opts={}){
  const w = opts.w || 560, h = opts.h || 46;
  const svg = svgEl("svg", {viewBox:`0 0 ${w} ${h}`, width:"100%", height:h});
  const total = segments.reduce((a,s)=>a+s.value,0);
  let xAcc = 0;
  segments.forEach(seg => {
    const segW = (seg.value/total) * w;
    const rect = svgEl("rect", {x:xAcc, y:8, width:Math.max(segW,0.5), height:h-16, fill:seg.color});
    rect.addEventListener("mousemove",(e)=>showTip(e, `${seg.label}: ${(seg.value/total*100).toFixed(0)}%`));
    rect.addEventListener("mouseleave", hideTip);
    svg.appendChild(rect);
    if (segW > 34){
      const t = svgEl("text", {x:xAcc+segW/2, y:h/2+4, "text-anchor":"middle", fill:"#fff", "font-size":12, "font-weight":600});
      t.textContent = (seg.value/total*100).toFixed(0)+"%";
      svg.appendChild(t);
    }
    xAcc += segW;
  });
  return svg;
}

function kpiCard({label, value, sub, deltaText, deltaDir}){
  const div = document.createElement("div");
  div.className = "card kpi";
  div.innerHTML = `
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${deltaText ? `<div class="kpi-delta ${deltaDir}">${deltaText}</div>` : (sub ? `<div class="kpi-delta flat">${sub}</div>` : "")}
  `;
  return div;
}

function card(title, note){
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<h3>${title}</h3>`;
  if (note){
    const p = document.createElement("div");
    p.className = "card-note";
    p.textContent = note;
    div.appendChild(p);
  }
  return div;
}
function appendChart(cardEl, chartEl, beforeNote){
  if (beforeNote) cardEl.insertBefore(chartEl, cardEl.querySelector(".card-note"));
  else cardEl.appendChild(chartEl);
}

function renderExec(){

  const kpiRow = document.createElement("div");
  kpiRow.className = "grid kpi-row";
  const k = DATA.kpi;
  kpiRow.appendChild(kpiCard({label:"Current NPS", value:k.current_nps, deltaText:"down from ~39 two years ago", deltaDir:"down"}));
  kpiRow.appendChild(kpiCard({label:"Relationship CSAT", value:k.current_relationship_csat+" / 5", sub:"latest survey wave"}));
  kpiRow.appendChild(kpiCard({label:"Total Customers", value:k.total_customers.toLocaleString(), sub:k.churn_rate_pct+"% churned to date"}));
  kpiRow.appendChild(kpiCard({label:"Open Tickets", value:k.open_tickets.toLocaleString(), sub:k.resolved_tickets.toLocaleString()+" resolved"}));
  kpiRow.appendChild(kpiCard({label:"Avg. Resolution", value:k.avg_resolution_hours+"h", sub:"across all priorities"}));
  el.appendChild(kpiRow);

  const row = document.createElement("div");
  row.className = "grid chart-row-2";
  const c1 = card("Satisfaction trend", "Monthly NPS (bold: 3-month moving average) — the metric has been declining since mid-2024, most sharply after Q4 2024.");
  appendChart(c1, lineChart(DATA.nps_trend, "survey_month", [
    {key:"nps_score", color:"var(--text-muted)", width:1.4, opacity:0.55, label:"Monthly NPS"},
    {key:"nps_3mo_moving_avg", color:"var(--accent)", width:2.4, label:"3mo avg"},
  ]), true);
  row.appendChild(c1);

  const c2 = card("Risk distribution", "Active customers tiered by churn risk (excludes already-churned).");
  const tiers = ["Healthy","Watch","Medium Risk","High Risk"].map(t => ({label:t, value:(DATA.risk_tiers.find(r=>r.risk_tier===t)||{n:0}).n, color:STATUS_COLOR[t]}));
  appendChart(c2, barChart(tiers, "label", "value", {color:"var(--accent)", padL:90, barH:28, fmt:v=>v.toLocaleString()}), true);
  tiers.forEach((t,i) => { c2.querySelectorAll("rect")[i].setAttribute("fill", t.color); });
  row.appendChild(c2);
  el.appendChild(row);
  return el;
}

function renderFeedback(){
  const el = document.createElement("div");
  el.innerHTML = `<div class="page-head"><div><h1>Customer Feedback</h1><p>37,427 feedback items across four channels, scored with NLTK VADER.</p></div></div>`;

  const row1 = document.createElement("div");
  row1.className = "grid chart-row-even";

  const c1 = card("Sentiment breakdown");
  const segs = ["Negative","Neutral","Positive"].map(l => ({label:l, value:(DATA.sentiment_counts.find(s=>s.sentiment_label===l)||{n:0}).n, color:STATUS_COLOR[l]}));
  appendChart(c1, divergingBar(segs));
  const legend = document.createElement("div"); legend.className="legend";
  segs.forEach(s => legend.innerHTML += `<div class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${s.label} (${s.value.toLocaleString()})</div>`);
  c1.appendChild(legend);
  row1.appendChild(c1);

  const c2 = card("Feedback channels", "Volume by channel; color-independent — sentiment is fairly even across channels.");
  appendChart(c2, barChart(DATA.channels.map(d=>({label:d.feedback_channel, value:d.n})), "label", "value", {padL:100, barH:26, fmt:v=>v.toLocaleString()}), true);
  row1.appendChild(c2);
  el.appendChild(row1);

  const row2 = document.createElement("div");
  row2.className = "grid chart-row-even";
  row2.style.marginTop = "16px";

  const c3 = card("Top complaint topics", "TF-IDF + NMF over negative feedback (Module 6) — share of negative feedback.");
  appendChart(c3, barChart(DATA.topics.map(d=>({label:d.topic_label, value:d.n})), "label", "value", {padL:190, barH:30, color:"var(--critical)", fmt:v=>v.toLocaleString()}), true);
  row2.appendChild(c3);

  const c4 = card("Word frequency", "Size ≈ mention count. Positive in accent, negative in critical.");
  const wc = document.createElement("div"); wc.className = "word-cloud";
  const maxP = Math.max(...DATA.words_positive.map(w=>w.n)), maxN = Math.max(...DATA.words_negative.map(w=>w.n));
  DATA.words_positive.slice(0,14).forEach(w => {
    const span = document.createElement("span");
    span.style.fontSize = (13 + (w.n/maxP)*22) + "px";
    span.style.color = "var(--good)";
    span.textContent = w.word;
    span.title = w.n + " mentions";
    wc.appendChild(span);
  });
  DATA.words_negative.slice(0,10).forEach(w => {
    const span = document.createElement("span");
    span.style.fontSize = (12 + (w.n/maxN)*18) + "px";
    span.style.color = "var(--critical)";
    span.textContent = w.word;
    span.title = w.n + " mentions";
    wc.appendChild(span);
  });
  appendChart(c4, wc, true);
  row2.appendChild(c4);
  el.appendChild(row2);

  return el;
}

function renderSupport(){
  const el = document.createElement("div");
  el.innerHTML = `<div class="page-head"><div><h1>Support Analytics</h1><p>8,469 tickets — resolution performance, priority mix, and category drivers.</p></div></div>`;

  const row1 = document.createElement("div");
  row1.className = "grid chart-row-even";

  const c1 = card("Resolution time by priority", "Hours to resolve, real priority tiers (SLA target shown as label).");
  const order = ["Critical","High","Medium","Low"];
  const resData = order.map(p => {
    const d = DATA.resolution_performance.find(r=>r.priority===p);
    return {label:`${p} (SLA ${d.sla_hours}h)`, value:d.avg_resolution_hours, color:STATUS_COLOR[p]};
  });
  const bc1 = barChart(resData, "label", "value", {padL:150, barH:28, fmt:v=>v+"h"});
  appendChart(c1, bc1, true);
  resData.forEach((d,i)=> bc1.querySelectorAll("rect")[i].setAttribute("fill", d.color));
  row1.appendChild(c1);

  const c2 = card("SLA attainment", "% of resolved tickets that met their priority's SLA target.");
  const slaData = order.map(p => {
    const d = DATA.resolution_performance.find(r=>r.priority===p);
    return {label:p, value:d.sla_attainment_pct, color:STATUS_COLOR[p]};
  });
  const bc2 = barChart(slaData, "label", "value", {padL:80, barH:28, max:100, fmt:v=>v+"%"});
  appendChart(c2, bc2, true);
  slaData.forEach((d,i)=> bc2.querySelectorAll("rect")[i].setAttribute("fill", d.color));
  row1.appendChild(c2);
  el.appendChild(row1);

  const row2 = document.createElement("div");
  row2.className = "grid chart-row-2";
  row2.style.marginTop = "16px";

  const c3 = card("Category analysis", "Ticket categories by volume, resolution time, and satisfaction.");
  const tbl = document.createElement("div"); tbl.className = "table-wrap";
  tbl.innerHTML = `<table><thead><tr><th>Category</th><th class="num">Tickets</th><th class="num">Share</th><th class="num">Avg. Res.</th><th class="num">Avg. CSAT</th></tr></thead><tbody>
    ${DATA.categories.map(c => `<tr><td>${c.category}</td><td class="mono">${c.ticket_count.toLocaleString()}</td><td class="mono">${c.pct_of_all_tickets}%</td><td class="mono">${c.avg_resolution_hours}h</td><td class="mono">${c.avg_csat_rating}</td></tr>`).join("")}
  </tbody></table>`;
  c3.insertBefore(tbl, c3.querySelector('.card-note'));
  row2.appendChild(c3);

  const c4 = card("Ticket priority mix");
  const pri = order.map(p => ({label:p, value:(DATA.priority_counts.find(x=>x.priority===p)||{n:0}).n, color:STATUS_COLOR[p]}));
  const bc4 = barChart(pri, "label", "value", {padL:70, barH:28, fmt:v=>v.toLocaleString()});
  appendChart(c4, bc4);
  pri.forEach((d,i)=> bc4.querySelectorAll("rect")[i].setAttribute("fill", d.color));
  row2.appendChild(c4);
  el.appendChild(row2);

  return el;
}

function renderCX(){
  const el = document.createElement("div");
  el.innerHTML = `<div class="page-head"><div><h1>Customer Experience</h1><p>NPS by segment, CSAT by market, and the retention-priority list.</p></div></div>`;

  const row1 = document.createElement("div");
  row1.className = "grid chart-row-even";

  const c1 = card("NPS by segment");
  appendChart(c1, barChart(DATA.segment.map(d=>({label:d.customer_segment, value:d.nps_score})), "label", "value", {padL:100, barH:30}));
  row1.appendChild(c1);

  const c2 = card("CSAT by country", "Relationship CSAT, ranked.");
  appendChart(c2, barChart(DATA.country.map(d=>({label:d.country, value:d.avg_relationship_csat})), "label", "value", {padL:110, barH:24, max:5, fmt:v=>v+"/5"}), true);
  row1.appendChild(c2);
  el.appendChild(row1);

  const row2 = document.createElement("div");
  row2.className = "grid chart-row-2";
  row2.style.marginTop = "16px";

  const c3 = card("Retention-priority list", "Active customers in the two highest risk tiers, worst first (sql: vw_at_risk_customers).");
  const tbl = document.createElement("div"); tbl.className = "table-wrap";
  tbl.innerHTML = `<table><thead><tr><th>Customer</th><th>Segment</th><th>Plan</th><th class="num">NPS</th><th class="num">High-sev (90d)</th><th>Risk</th></tr></thead><tbody>
    ${DATA.risk_list.slice(0,10).map(r => `<tr><td class="mono">${r.customer_id}</td><td>${r.customer_segment}</td><td>${r.subscription_plan}</td><td class="mono">${r.latest_nps ?? "–"}</td><td class="mono">${r.high_severity_last_90d}</td><td><span class="badge ${r.risk_tier==='High Risk'?'critical':'warning'}"><span class="dot" style="background:currentColor"></span>${r.risk_tier}</span></td></tr>`).join("")}
  </tbody></table>`;
  c3.insertBefore(tbl, c3.querySelector('.card-note'));
  row2.appendChild(c3);

  const c4 = card("Monthly sentiment trend", "Feedback sentiment score, bold line = 3-month moving average.");
  appendChart(c4, lineChart(DATA.sentiment_trend, "feedback_month", [
    {key:"avg_sentiment_score", color:"var(--text-muted)", width:1.4, opacity:0.55, label:"Monthly"},
    {key:"sentiment_3mo_moving_avg", color:"var(--accent)", width:2.4, label:"3mo avg"},
  ], {zeroLine:false}), true);
  row2.appendChild(c4);
  el.appendChild(row2);

  return el;
}

const RENDERERS = {exec:renderExec, feedback:renderFeedback, support:renderSupport, cx:renderCX};

function mount(pageId){
  const main = document.getElementById("main");
  main.innerHTML = "";
  main.appendChild(RENDERERS[pageId]());
  document.querySelectorAll(".nav-btn").forEach(b => {
    if (b.dataset.page === pageId) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  try { localStorage.setItem("voiceiq_page", pageId); } catch(e){}
}

const nav = document.getElementById("nav");
PAGES.forEach(p => {
  const btn = document.createElement("button");
  btn.className = "nav-btn";
  btn.dataset.page = p.id;
  btn.innerHTML = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="${p.icon}"/></svg>${p.label}`;
  btn.addEventListener("click", () => mount(p.id));
  nav.appendChild(btn);
});

let initial = "exec";
try { initial = localStorage.getItem("voiceiq_page") || "exec"; } catch(e){}
mount(initial);
</script>
